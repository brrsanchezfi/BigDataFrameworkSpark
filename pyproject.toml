[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "DKOps"
version = "0.3.5"
description = "Lakehouse automation framework — IngestionEngine, Medallion architecture and Delta governance for Spark and Databricks"
readme = "README.md"
authors = [
    { name = "Roberto", email = "brrsanchezfi@unal.edu.co" }
]
# Forma de tabla, no la forma corta de PEP 639 (`license = "MIT"`): esa solo la
# entiende setuptools >= 77, y el runtime de Databricks construye con uno
# anterior. Ver issue #23 — con la forma corta la instalacion desde git falla
# con ERROR_WHEEL_BUILD y ninguna tarea del cluster llega a arrancar.
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["databricks", "spark", "delta", "lakehouse", "dataops", "medallion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]

# Dependencias base — solo lo que el framework necesita siempre.
# PySpark y Delta NO van aquí porque en Databricks ya están instalados
# nativamente y agregarlos causaría conflictos en el cluster.
dependencies = [
    "loguru>=0.7.0",
]

[project.optional-dependencies]

# Instalar en PC local para desarrollo y pruebas
# pip install "DKOps[local]"
local = [
    "pyspark==3.5.3",
    "delta-spark==3.2.0",
]

# Instalar en PC local para conectar a un cluster remoto via Databricks Connect
# La versión debe coincidir con el DBR del cluster:
#   DBR 14.x → databricks-connect==14.x
#   DBR 15.x → databricks-connect==15.x
# pip install "DKOps[databricks-connect]"
databricks-connect = [
    "databricks-connect>=14.0,<16.0",
    "zstandard>=0.21.0",
]

# Herramientas de desarrollo
# pip install "DKOps[dev]"
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "jsonschema>=4.0",   # scripts/validate_contracts.py
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

# Todo junto para desarrollo local completo
# pip install "DKOps[local,dev]"

[project.urls]
Homepage      = "https://brrsanchezfi.github.io/DKOps/"
Documentation = "https://brrsanchezfi.github.io/DKOps/"
Repository    = "https://github.com/brrsanchezfi/DKOps"
Changelog     = "https://github.com/brrsanchezfi/DKOps/releases"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# ── Herramientas ──────────────────────────────────────────────────────────────

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",  # line too long — black lo maneja
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# La suite por defecto es la de mocks. Los tests de tests/integration usan
# Spark + Delta reales y deben correr en su PROPIO proceso: los módulos con
# mocks hacen sys.modules.setdefault("pyspark", MagicMock()), lo que dejaría
# un pyspark falso si ambos grupos compartieran intérprete.
#   pytest                      → suite de mocks
#   pytest tests/integration    → integración con Spark real
addopts  = "--ignore=tests/integration"
markers  = [
    "integration: requiere PySpark y Delta reales; ejecutar en su propio proceso",
]

[tool.mypy]
python_version = "3.9"
strict         = true